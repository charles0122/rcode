[package]
name = "rcode"
version.workspace = true
edition = "2024"
description = "An open radial visual code with a local encoding and decoding workbench"
license.workspace = true
repository = "https://github.com/charles0122/rcode"

[workspace]
members = ["ffi"]
resolver = "3"

[workspace.package]
version = "0.1.0"
license = "MIT"

[lib]
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
crc32fast = "1.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reed-solomon = "0.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"

[profile.release]
lto = "thin"

[profile.test]
opt-level = 2
